name: Test

on: [ push, pull_request ]

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test release tools
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Run Busted
        uses: lunarmodules/busted@v2
