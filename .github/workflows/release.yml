name: Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and select release commit
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash tools/check_release.sh
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            git merge-base --is-ancestor "refs/tags/$VERSION^{commit}" origin/main || {
              echo "::error::Existing release tag is not on main."
              exit 1
            }
            git checkout --detach "refs/tags/$VERSION^{commit}"
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RETRY: ${{ steps.version.outputs.retry }}
        run: |
          python3 tools/prepare_release.py "$VERSION"
          if [[ "$RETRY" == true ]] && ! git diff --quiet -- CHANGELOG.md _meta.lua; then
            echo "::error::Existing tag does not contain prepared release metadata."
            exit 1
          fi

      - name: Check diff formatting
        run: git diff --check

      - name: Test release preparation
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Run Busted
        uses: lunarmodules/busted@v2

      - name: Commit metadata and create tag
        if: steps.version.outputs.retry != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md _meta.lua
          if ! git diff --cached --quiet; then
            git commit -m "Release $VERSION"
          fi
          git tag "$VERSION" HEAD
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$VERSION"

      - name: Zip release
        run: |
          cd ..
          cp -r "$GITHUB_WORKSPACE" shelfsync.koplugin
          zip -r shelfsync.koplugin.zip shelfsync.koplugin -x '*/*.git*' '*/spec/*' '*/lua_modules/*' '*/.luarocks/*' '*/lua' '*/luarocks' '*/*.rockspec' '*/tools/*' '*/README.md' '*/CHANGELOG.md' '*/LICENSE'

      - name: Zip cookie-fetch scripts
        run: |
          cd ..
          mkdir -p shelfsync-fetch-cookies/support
          cp "$GITHUB_WORKSPACE"/tools/fetch-cookies.sh "$GITHUB_WORKSPACE"/tools/fetch-cookies.bat shelfsync-fetch-cookies/
          cp "$GITHUB_WORKSPACE"/tools/support/fetch_cookies.py shelfsync-fetch-cookies/support/
          zip -r shelfsync-fetch-cookies.zip shelfsync-fetch-cookies

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ANCHOR="$(echo "$VERSION" | sed -E 's/[^A-Za-z0-9]//g')"
          awk -v ver="$VERSION" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "_No changelog entry found for $VERSION._" > release_notes.md
          fi

          {
            echo
            echo "---"
            echo
            echo "Full changelog: [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md#$ANCHOR)"
          } >> release_notes.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            ../shelfsync.koplugin.zip
            ../shelfsync-fetch-cookies.zip
